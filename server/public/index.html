<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        
        nav {
            background-color: #444;
            padding: 0.5rem;
        }
        
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
        }
        
        nav ul li {
            margin: 0 1rem;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .post {
            background-color: white;
            margin-bottom: 2rem;
            padding: 2rem;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .post h2 {
            color: #333;
            margin-bottom: 1rem;
        }
        
        .post p {
            color: #666;
            margin-bottom: 1rem;
        }
        
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>我的博客</h1>
    </header>
    
    <nav>
        <ul>
            <li><a href="#">首页</a></li>
            <li><a href="#">文章</a></li>
            <li><a href="#">关于</a></li>
            <li><a href="#">联系</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <div class="post">
            <h2>欢迎来到我的博客</h2>
            <p>这里是关于前端开发、设计和创意的分享平台。在这里，我会分享一些有用的知识和经验，希望对大家有所帮助。</p>
        </div>
        
        <div class="post">
            <h2>最新文章</h2>
            <p>文章标题：如何提高前端开发效率</p>
            <p>内容摘要：在前端开发中，效率是非常重要的。本文将介绍一些提高效率的方法和工具，包括代码优化、自动化构建工具的使用等。</p>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2024 我的博客. 保留所有权利.</p>
    </footer>
</body>
</html>
